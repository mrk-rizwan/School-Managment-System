name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Throwaway values for the CI service containers only. They protect nothing:
# the database lives for one job and is reachable only from the runner.
env:
  PG_USER: asms_ci
  PG_PASS: ci_only
  PG_DB: asms

jobs:
  ci:
    runs-on: ubuntu-latest
    # The 3,000-recipient tests and Playwright took it past 30 minutes (2026-10-05); Phase 3 past 45 (2026-10-06).
    timeout-minutes: 75

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.PG_USER }}
          POSTGRES_PASSWORD: ${{ env.PG_PASS }}
          POSTGRES_DB: ${{ env.PG_DB }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U asms_ci -d asms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create test database
        run: docker exec "${{ job.services.postgres.id }}" psql -U "$PG_USER" -d "$PG_DB" -c "CREATE DATABASE asms_test;"

      # Every key from .env.example. The three secrets are generated per run.
      # The URLs are assembled from parts so no credentialed URL sits in the repo.
      - name: Write CI .env
        run: |
          db_auth="${PG_USER}:${PG_PASS}"
          cat > .env <<ENVFILE
          POSTGRES_USER=${PG_USER}
          POSTGRES_PASSWORD=${PG_PASS}
          POSTGRES_DB=${PG_DB}
          REDIS_PASSWORD=unused-in-ci
          NODE_ENV=development
          API_PORT=3461
          APP_URL=http://localhost:3460
          DATABASE_URL=postgresql://${db_auth}@127.0.0.1:5432/${PG_DB}
          TEST_DATABASE_URL=postgresql://${db_auth}@127.0.0.1:5432/asms_test
          REDIS_URL=redis://127.0.0.1:6379
          IDENTITY_HASH_KEY=$(openssl rand -base64 32)
          FIELD_ENCRYPTION_KEYS=k1:$(openssl rand -base64 32)
          PASSWORD_PEPPER=$(openssl rand -base64 32)
          S3_ENDPOINT=http://127.0.0.1:9000
          S3_REGION=us-east-1
          S3_BUCKET=asms-documents
          S3_ACCESS_KEY_ID=ci-access
          S3_SECRET_ACCESS_KEY=ci-$(openssl rand -hex 16)
          SMTP_HOST=127.0.0.1
          SMTP_PORT=1025
          SMTP_FROM="ASMS <no-reply@localhost>"
          PLATFORM_ADMIN_EMAIL=admin@ci.invalid
          PLATFORM_ADMIN_PASSWORD=Ci-$(openssl rand -hex 12)
          ENVFILE

      # Object storage for the document suites (API test/documents/*, web students-real).
      # Same digest-pinned Chainguard image as docker-compose.yml. Root credentials are this run's S3 values from
      # the .env above, passed by name so they never appear on a command line. The API creates
      # the bucket on first write outside production (object-storage.ts).
      # No Mailpit: API tests swap in FakeMailer or run their own failing SMTP stub, the real
      # Mailer is fire-and-forget and never rejects (R92), and no test reads a mailbox.
      - name: Start MinIO
        run: |
          set -a; . ./.env; set +a
          export MINIO_ROOT_USER=$S3_ACCESS_KEY_ID
          export MINIO_ROOT_PASSWORD=$S3_SECRET_ACCESS_KEY
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD \
            cgr.dev/chainguard/minio@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034 server /data
          for _ in $(seq 1 30); do
            if curl -fs -o /dev/null http://127.0.0.1:9000/minio/health/live; then
              echo "MinIO is ready"; exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become ready within 60 s"; docker logs minio; exit 1

      - name: Build shared package
        run: pnpm --filter @asms/shared build

      # Explicit: prisma migrate does not generate the client.
      - name: Generate Prisma client
        run: |
          set -a; . ./.env; set +a
          pnpm --filter @asms/api exec prisma generate

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Migrate database
        run: pnpm --filter @asms/api db:deploy

      - name: Migrate test database
        run: pnpm --filter @asms/api db:test:deploy

      - name: API tests
        run: pnpm --filter @asms/api test

      # The mobile package's Jest suites (no emulator): lint and typecheck already ran above through
      # pnpm -r, so the fast mobile checks never wait on the emulator job (contracts/slice-15.md §13.3).
      - name: Mobile unit tests
        run: pnpm --filter @asms/mobile test

      # Regenerates the OpenAPI document and the web and mobile clients; fails if the
      # committed copies differ or new files appear.
      - name: OpenAPI staleness check
        run: |
          set -a; . ./.env; set +a
          pnpm --filter @asms/api build
          pnpm --filter @asms/api openapi
          pnpm --filter @asms/web api:generate
          pnpm --filter @asms/mobile api:generate
          git diff --exit-code -- apps/api/openapi apps/web/lib/api apps/mobile/src/api
          untracked=$(git status --porcelain --untracked-files=all -- apps/api/openapi apps/web/lib/api apps/mobile/src/api)
          if [ -n "$untracked" ]; then
            echo "Generated files are not committed:"; echo "$untracked"; exit 1
          fi

      - name: Web build
        run: pnpm --filter @asms/web build

      - name: Install Playwright browser
        run: pnpm --filter @asms/web exec playwright install --with-deps chromium

      - name: Web end-to-end tests
        run: pnpm --filter @asms/web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The mobile app's emulator proof (contracts/slice-15.md §13.3). The services and the .env step
  # are duplicated from `ci` on purpose (YAML, not code); they may become a composite action later.
  # The fast mobile checks also run in `ci` through pnpm -r, so they never wait on the emulator.
  mobile:
    runs-on: ubuntu-latest
    # Seven flows since slice 16 (contracts/slice-16.md §15.4).
    timeout-minutes: 60

    env:
      MAESTRO_VERSION: 2.11.0
      SCHOOL_CODE: demo
      # A made-up identity number for the throwaway CI school; its default password is the same
      # digits. It protects nothing: the database lives for one job.
      PRINCIPAL_CNIC: '3520299999991'
      DEV_SCHOOL_PRINCIPAL_CNIC: '3520299999991'
      # Required by the seed (no default); a made-up number. The seed accepts the CI identity
      # number only because DATABASE_URL's host is 127.0.0.1 (loopback).
      DEV_SCHOOL_PRINCIPAL_PHONE: '+923000000000'
      # The classroom the slice-16 flows run against (contracts/slice-16.md §15.3): a teacher and a
      # guardian with made-up numbers, accepted only because DATABASE_URL's host is loopback.
      DEV_SCHOOL_CLASSROOM: '1'
      DEV_SCHOOL_TEACHER_CNIC: '3520299999992'
      DEV_SCHOOL_TEACHER_PHONE: '+923000000001'
      DEV_SCHOOL_GUARDIAN_CNIC: '3520299999993'
      DEV_SCHOOL_GUARDIAN_PHONE: '+923000000002'
      TEACHER_CNIC: '3520299999992'
      GUARDIAN_CNIC: '3520299999993'
      API_PID_FILE: ${{ github.workspace }}/api.pid
      WORKER_PID_FILE: ${{ github.workspace }}/worker.pid

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.PG_USER }}
          POSTGRES_PASSWORD: ${{ env.PG_PASS }}
          POSTGRES_DB: ${{ env.PG_DB }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U asms_ci -d asms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # The APK build plus the emulator's system image filled the runner's disk (2026-10-05).
      # These preinstalled toolchains are never used by this job.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @asms/shared build

      - name: Mobile lint, typecheck, unit tests
        run: |
          pnpm --filter @asms/mobile lint
          pnpm --filter @asms/mobile typecheck
          pnpm --filter @asms/mobile test

      - name: Bundle check and expo-doctor
        working-directory: apps/mobile
        run: |
          pnpm exec expo export --platform android --output-dir dist
          pnpm exec expo-doctor

      # A release build can never be pointed at http: the config refuses it.
      - name: https guard
        working-directory: apps/mobile
        run: |
          if APP_PROFILE=production EXPO_PUBLIC_API_URL=http://insecure.invalid pnpm exec expo config --type public >/dev/null 2>&1; then
            echo "app.config.ts accepted an http URL for the production profile"; exit 1
          fi

      # Same keys as the ci job's .env (every key from .env.example), secrets generated per run.
      - name: Write CI .env
        run: |
          db_auth="${PG_USER}:${PG_PASS}"
          cat > .env <<ENVFILE
          POSTGRES_USER=${PG_USER}
          POSTGRES_PASSWORD=${PG_PASS}
          POSTGRES_DB=${PG_DB}
          REDIS_PASSWORD=unused-in-ci
          NODE_ENV=development
          API_PORT=3461
          APP_URL=http://localhost:3460
          DATABASE_URL=postgresql://${db_auth}@127.0.0.1:5432/${PG_DB}
          TEST_DATABASE_URL=postgresql://${db_auth}@127.0.0.1:5432/asms_test
          REDIS_URL=redis://127.0.0.1:6379
          IDENTITY_HASH_KEY=$(openssl rand -base64 32)
          FIELD_ENCRYPTION_KEYS=k1:$(openssl rand -base64 32)
          PASSWORD_PEPPER=$(openssl rand -base64 32)
          S3_ENDPOINT=http://127.0.0.1:9000
          S3_REGION=us-east-1
          S3_BUCKET=asms-documents
          S3_ACCESS_KEY_ID=ci-access
          S3_SECRET_ACCESS_KEY=ci-$(openssl rand -hex 16)
          SMTP_HOST=127.0.0.1
          SMTP_PORT=1025
          SMTP_FROM="ASMS <no-reply@localhost>"
          PLATFORM_ADMIN_EMAIL=admin@ci.invalid
          PLATFORM_ADMIN_PASSWORD=Ci-$(openssl rand -hex 12)
          ENVFILE

      - name: Generate Prisma client
        run: |
          set -a; . ./.env; set +a
          pnpm --filter @asms/api exec prisma generate

      # Object storage, as in the ci job: the classroom seed stages the diary entry's photo and the
      # parent flow opens its thumbnail (contracts/slice-16.md §15.4).
      - name: Start MinIO
        run: |
          set -a; . ./.env; set +a
          export MINIO_ROOT_USER=$S3_ACCESS_KEY_ID
          export MINIO_ROOT_PASSWORD=$S3_SECRET_ACCESS_KEY
          docker run -d --name minio -p 127.0.0.1:9000:9000             -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD             cgr.dev/chainguard/minio@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034 server /data
          for _ in $(seq 1 30); do
            if curl -fs -o /dev/null http://127.0.0.1:9000/minio/health/live; then
              echo "MinIO is ready"; exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become ready within 60 s"; docker logs minio; exit 1

      - name: Migrate database
        run: pnpm --filter @asms/api db:deploy

      - name: Seed a school, its principal and the classroom
        run: |
          pnpm --filter @asms/api seed:platform-admin
          pnpm --filter @asms/api seed:dev-school

      # The worker beside the API: without it no attendance day status is written and the parent's
      # card never says "Absent". ci-run.sh restarts both whenever MOBILE_MIN_APP_VERSION changes.
      - name: Start the API and the worker
        run: |
          pnpm --filter @asms/api build
          set -a; . ./.env; set +a
          MOBILE_MIN_APP_VERSION=0.0.0 nohup node apps/api/dist/main.js > api.log 2>&1 &
          echo $! > "$API_PID_FILE"
          MOBILE_MIN_APP_VERSION=0.0.0 WORKER_HEALTH_PORT=3002 nohup node apps/api/dist/worker.js > worker.log 2>&1 &
          echo $! > "$WORKER_PID_FILE"
          up() {
            for _ in $(seq 1 60); do
              if curl -fs -o /dev/null "$1"; then echo "$2 is up"; return 0; fi
              sleep 2
            done
            echo "$2 did not start"; tail -n 50 api.log worker.log; return 1
          }
          up http://127.0.0.1:3461/api/v1/health API
          up http://127.0.0.1:3002/health worker

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # The action's default list still names the removed `tools` package, which fails
          # sdkmanager; the emulator runner installs the system image and emulator itself.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      # R155 "cleartext traffic is off" and no Android backup of the app's data (the SQLite file and
      # its cached rows, security review M1): a production-profile prebuild's manifest says both.
      - name: Release manifest refuses cleartext and backup
        working-directory: apps/mobile
        run: |
          APP_PROFILE=production EXPO_PUBLIC_API_URL=https://api.example.invalid EXPO_PUBLIC_PUSH_ENABLED=false \
            pnpm exec expo prebuild --platform android --no-install --clean
          manifest=android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' "$manifest" || { echo "cleartext not refused"; exit 1; }
          grep -q 'android:allowBackup="false"' "$manifest" || { echo "backup not refused"; exit 1; }
          if grep -rq 'usesCleartextTraffic="true"' "$manifest" android/app/src/release 2>/dev/null; then
            echo "the release manifest allows cleartext"; exit 1
          fi

      # The e2e APK: the development profile (its own .dev package, http to the host's API) in the
      # release variant, so the JS is embedded and the dev-client launcher is not in the way.
      - name: Prebuild and build the e2e APK
        working-directory: apps/mobile
        env:
          APP_PROFILE: development
          EXPO_PUBLIC_API_URL: http://10.0.2.2:3461
          EXPO_PUBLIC_PUSH_ENABLED: 'false'
        run: |
          pnpm exec expo prebuild --platform android --no-install --clean
          # Only the emulator's ABI: compiling native code for all four took 20-54 min and hit the
          # job limit. Store builds are made elsewhere and keep every ABI.
          cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "AVD snapshot created"

      - name: Maestro flows on the emulator
        # Its own limit: on the first run the emulator hung on shutdown and the job limit cancelled
        # everything, including the evidence upload (2026-10-05).
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK: ${{ github.workspace }}/apps/mobile/android/app/build/outputs/apk/release/app-release.apk
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash apps/mobile/maestro/ci-run.sh

      # Kept on green runs too: the slice 27 screenshot of the claim sheet is the evidence that
      # FLAG_SECURE covers the slip (a black frame). Fixture data only.
      - name: Upload Maestro screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: apps/mobile/maestro/out/**/*.png
          # Maestro writes takeScreenshot under a hidden .maestro folder.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Maestro output and the API log
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e
          path: |
            apps/mobile/maestro/out/
            api.log
            worker.log
          retention-days: 7
          if-no-files-found: ignore
