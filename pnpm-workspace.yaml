packages:
  - apps/*
  - packages/*

# Packages allowed to run install scripts. Everything else is refused.
# @scarf/scarf is install telemetry: explicitly denied.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  sharp: true
  '@scarf/scarf': false
  '@parcel/watcher': false
  esbuild: true
  unrs-resolver: true
  # firebase-admin's dependencies: client-SDK defaults, a version notice, an optional native
  # accelerator with a pure-JS fallback. None is needed by the API.
  '@firebase/util': false
  msgpackr-extract: false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.28'
  - '@expo/config-plugins@57.0.10'
  - '@expo/config@57.0.10'
  - '@expo/image-utils@0.11.6'
  - '@expo/metro-config@57.0.13'
  - '@expo/metro-file-map@57.0.4'
  - '@expo/prebuild-config@57.0.17'
  - '@expo/require-utils@57.0.6'
  - '@expo/router-server@57.0.12'
  - babel-preset-expo@57.0.14
  - expo-asset@57.0.19
  - expo-constants@57.0.21
  - expo-modules-autolinking@57.0.14
  - expo-modules-core@57.0.21
  - expo@57.0.27
  - '@expo/ui@57.0.22'
  - expo-image-manipulator@57.0.21
  - expo-linking@57.0.12
  - expo-notifications@57.0.22
  - expo-router@57.0.25
  - expo-screen-capture@57.0.4
  - expo-sqlite@57.0.4
