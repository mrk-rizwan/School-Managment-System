# slice-16 §15.2 (16a) — CI only. Same session as register-offline: the teacher writes today's
# English diary entry for 5 B (5 A's English entry is the seed's), and sees it reach the server.
# No photo: the emulator has no camera; the photo lane is proved in Jest.
# Env: SECTION_B.
appId: pk.asms.app.dev
---
- launchApp
- tapOn:
    id: 'tabs.classes'
# Since Phase 5 the Timetable and Events card sits above the sections, so 5 B's rows start below
# the fold on the emulator's screen: scroll to the row rather than wait for it.
- extendedWaitUntil:
    visible:
      id: 'classes.timetable'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'classes.section.${SECTION_B}.diary'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'classes.section.${SECTION_B}.diary'
- extendedWaitUntil:
    visible:
      id: 'diary.new'
    timeout: 20000
- tapOn:
    id: 'diary.new'
- extendedWaitUntil:
    visible:
      text: 'English'
    timeout: 20000
- tapOn:
    text: 'English'
- tapOn:
    id: 'diaryCompose.topic'
- inputText: 'Pages 12-14'
- hideKeyboard
- tapOn:
    id: 'diaryCompose.save'
- extendedWaitUntil:
    visible:
      text: 'Saved on (device|server).*'
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: 'Saved on server at .*'
    timeout: 60000
