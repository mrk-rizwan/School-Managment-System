# Phase 3 slice 21 (§3.9, R199) — CI only. A parent who paid by wallet photographs nothing new: the
# slip image is put in the emulator's gallery (addMedia) and chosen from there, in airplane mode.
# The phone says the claim and the slip are saved on the device; when the connection returns both
# reach the school (the server lists the claim, "Waiting for the office", and the on-phone section goes). ci-run.sh then verifies the claim over curl as the
# principal (payment.verify), and parent-receipt.yaml shows the receipt that verification issued.
# Env: SCHOOL_CODE, GUARDIAN_CNIC, STUDENT_ID.
appId: pk.asms.app.dev
---
- launchApp:
    clearState: true
- addMedia:
    - '../assets/deposit-slip.png'
- runFlow:
    file: common/sign-in.yaml
    env:
      IDENTITY: ${GUARDIAN_CNIC}
- tapOn:
    id: 'tabs.children'
- tapOn:
    id: 'children.card.${STUDENT_ID}.fees'
- extendedWaitUntil:
    visible:
      id: 'fees.upload'
    timeout: 30000
- tapOn:
    id: 'fees.upload'
- extendedWaitUntil:
    visible:
      id: 'depositSlip.screen'
    timeout: 20000
- setAirplaneMode: enabled
- tapOn:
    id: 'depositSlip.method.jazzcash'
- scrollUntilVisible:
    element:
      id: 'depositSlip.amount'
    direction: DOWN
- tapOn:
    id: 'depositSlip.amount'
- inputText: '500'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'depositSlip.library'
    direction: DOWN
- tapOn:
    id: 'depositSlip.library'
# The system photo picker: the one image in the gallery.
- extendedWaitUntil:
    visible:
      text: '.*(Photos|Recent|Images).*'
    timeout: 20000
    optional: true
- tapOn:
    point: '20%,35%'
# The slip preview sits below the fields once chosen; scroll to it before waiting.
- scrollUntilVisible:
    element:
      id: 'depositSlip.chosen'
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: 'depositSlip.chosen'
    timeout: 20000
- tapOn:
    id: 'depositSlip.save'
- scrollUntilVisible:
    element:
      text: 'Slip: waits for the claim to reach the school'
    direction: DOWN
    timeout: 20000
- assertVisible:
    text: '.*Saved on device.*'
- setAirplaneMode: disabled
# Once the claim and its slip are on the server the phone stops listing it under "on this phone"
# (the server's row takes over), so "Slip: with the school" shows only for a moment: wait for the
# server's row, then for the on-phone section to go.
- scrollUntilVisible:
    element:
      text: 'Waiting for the office'
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    notVisible:
      id: 'fees.local'
    timeout: 60000
